version: '3.8'

services:
  frontend:
    image: lermak/marketanalyzer-frontend:latest
    container_name: marketanalyzer-frontend
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.market-front.rule=Host(`${DOMAIN_NAME}`)"
      - "traefik.http.routers.market-front.entrypoints=websecure"
      - "traefik.http.routers.market-front.tls=true"
      - "traefik.http.routers.market-front.tls.certresolver=le"
      
      - "traefik.http.services.market-front.loadbalancer.server.port=80"

networks:
  traefik-public:
    external: true
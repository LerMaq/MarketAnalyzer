name: Build, publish and deploy scraper

on:
  push:
    branches:
      - master
    paths:
      - "scraper/**"
      - ".github/workflows/scraper.yml"
    tags:
      - "scraper-v*"
  workflow_dispatch:

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare Docker tags
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/scraper-v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/scraper-v}"
            echo "tags=lermak/marketanalyzer-scraper:$VERSION,lermak/marketanalyzer-scraper:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=lermak/marketanalyzer-scraper:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push scraper image
        uses: docker/build-push-action@v6
        with:
          context: ./scraper
          file: ./scraper/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: Deploy scraper to server
        if: ${{ vars.SCRAPER_DEPLOY_ENABLED == 'true' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/scraper-v')) }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SCRAPER_SERVER_HOST }}
          username: ${{ secrets.SCRAPER_SERVER_USER }}
          key: ${{ secrets.SCRAPER_SERVER_SSH_KEY }}
          script: |
            cd /opt/marketanalyzer-scraper
            docker compose pull
            docker compose up -d
            docker image prune -f